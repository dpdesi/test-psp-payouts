# yaml-language-server: $schema=./schema.json
#
# Lambda + API Gateway subsystem for handling payment status callbacks.
# Provider callbacks enter through the payment-provider ESG webhook; no BFF is
# defined because no person-facing user activity was provided in the request.

subsystem: payment-status-callbacks
description: >-
  Handles payment status callbacks from the payment provider with an inbound
  webhook and event-driven processing. The inbound event
  PaymentStatusCallbackReceived is explicitly external and is produced by the
  payment-provider webhook.

tags:
  Environment: dev
  System: payments
  Owner: payments-team

artefact_defaults:
  bucket: dpdesi-test

hub:
  archive: true
  archive_retention_days: 30

bffs: []

controls:
  - name: payment-status-processor
    mode: event_reactor
    subscribes: [PaymentStatusCallbackReceived]
    # emits: # TODO: event(s) emitted after processing were not provided.

esgs:
  - name: payment-provider
    external: payment provider (external source of PaymentStatusCallbackReceived)
    webhook: true
    # PaymentStatusCallbackReceived is an inbound callback event from this
    # external provider, so the webhook-only ingress gateway takes no egress.

operations:
  event_lake:
    enabled: true
  fault_monitor:
    enabled: true
    emails: [dpdeslandes+avc-poc@gmail.com]
  observability:
    enabled: true
    emails: [dpdeslandes+avc-poc@gmail.com]
  regional_health:
    enabled: false
